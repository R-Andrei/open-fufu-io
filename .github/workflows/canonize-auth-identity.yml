name: Canonize auth and identity documentation

on:
  push:
    branches:
      - docs/auth-identity-closure

permissions:
  contents: write

jobs:
  patch-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/auth-identity-closure
          fetch-depth: 0
      - name: Apply accepted auth and identity specification
        run: python .github/scripts/canonize_auth_identity.py
      - name: Commit canonical documentation
        run: |
          set -euo pipefail
          git config user.name "open-fufu-doc-sync"
          git config user.email "open-fufu-doc-sync@users.noreply.github.com"
          git add docs/AUTH_AND_IDENTITY.md docs/OPEN_FUFU_DESIGN.md docs/OPENFRONT_INTEGRATION_PLAN.md docs/Auth.md
          if git diff --cached --quiet; then
            echo "No documentation changes to commit"
            exit 0
          fi
          git commit -m "docs: close V1 auth and identity architecture"
          git push origin HEAD:docs/auth-identity-closure
