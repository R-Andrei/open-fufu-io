name: 🧪 Rule Composition Deep Validation

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "src/core/rules/**"
      - "tests/Rule*.test.ts"
      - "tests/Origin*.test.ts"
      - "tests/EchoRuleRegistry.test.ts"
      - "docs/RULE_COMPOSITION.md"
      - "docs/ORIGIN_TRAIT_CATALOGUE.md"
      - "docs/ECHO_CATALOGUE.md"

permissions:
  contents: read

jobs:
  focused:
    name: Rule composition focused suite
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Core composition
        run: >-
          npx vitest run
          tests/RuleComposition.test.ts
          tests/RuleCompiler.test.ts
          tests/RuleNormalization.test.ts
          tests/RuleMaterialization.test.ts
          tests/RuleRationalMaterialization.test.ts
          tests/RuleValidationRegression.test.ts
      - name: Catalogue projection
        run: >-
          npx vitest run
          tests/EchoRuleRegistry.test.ts
          tests/OriginRuleManifest.test.ts
          tests/OriginManifestConformance.test.ts
          tests/OriginCatalogueCompile.test.ts

  exhaustive-origin:
    name: Exhaustive builder-legal Origin compilation
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      RULE_COMPOSITION_EXHAUSTIVE: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx vitest run tests/OriginCatalogueCompile.test.ts
