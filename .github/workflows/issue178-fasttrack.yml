name: Issue 178 fast-track patch

on:
  push:
    branches:
      - issue-178-operation-read-A91F6C

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[issue178-fasttrack]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply consolidated implementation patch
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          def read(path):
              return Path(path).read_text()
          def write(path, text):
              Path(path).write_text(text)
          def repl(path, old, new, count=1):
              text = read(path)
              if old not in text:
                  raise SystemExit(f"missing anchor in {path}: {old[:120]!r}")
              text2 = text.replace(old, new, count)
              write(path, text2)

          # Repair the already-staged OperationRef projection typo.
          repl(
              "src/simulation/ControllerQueryProjection.ts",
              "return sources.some((source) => fieldSourceContainsCell(state, source, id));",
              "return sources.some((source) => fieldSourceContainsCell(state, source, cellId));",
          )

          # Public SDK: opaque refs/action facade and removal of raw identity exports.
          p = "src/core/controller/ControllerApi.ts"
          s = read(p)
          s = s.replace("export type FactionId = string;", "type FactionId = string;")
          s = s.replace("export type OperationId = string;", "type OperationId = string;")
          s = s.replace("export type UnitId = string;", "type UnitId = string;")
          s = s.replace("export type StructureId = string;", "type StructureId = string;")
          s = s.replace("export type CommandKey = string;", "type CommandKey = string;")
          s = s.replace(
              "declare const structureRefBrand: unique symbol;",
              "declare const structureRefBrand: unique symbol;\ndeclare const operationRefBrand: unique symbol;\ndeclare const actionRefBrand: unique symbol;",
          )
          s = s.replace(
              "export type StructureRef = string & {\n  readonly [structureRefBrand]: \"StructureRef\";\n};",
              "export type StructureRef = string & {\n  readonly [structureRefBrand]: \"StructureRef\";\n};\n/** Stable opaque viewer-scoped public operation identity. */\nexport type OperationRef = string & { readonly [operationRefBrand]: \"OperationRef\" };\n/** Opaque receipt for one action staged through the controller facade. */\nexport type ActionRef = string & { readonly [actionRefBrand]: \"ActionRef\" };",
          )
          s = s.replace(
              "export interface FactionReadView {\n  readonly ref: FactionRef;\n  readonly status: FactionStatus;\n  readonly relation: PublicFactionRelation;\n  readonly territoryCells: number;\n  readonly teamId?: string;\n}",
              "export interface FactionReadView {\n  readonly ref: FactionRef;\n  readonly displayName: string;\n  readonly status: FactionStatus;\n  readonly relation: PublicFactionRelation;\n  readonly territoryCells: number;\n  readonly isMinorFaction: boolean;\n  readonly score: number;\n  readonly teamId?: string;\n}",
          )
          s = s.replace(
              "export interface TerritorialContactView {\n  readonly id: string;\n  readonly factionA: FactionId;\n  readonly factionB: FactionId;",
              "export interface TerritorialContactView {\n  readonly factionA: FactionRef;\n  readonly factionB: FactionRef;",
          )
          s = s.replace(
              "export interface OperationalContactView {\n  readonly id: string;\n  readonly factionA: FactionId;\n  readonly factionB: FactionId;",
              "export interface OperationalContactView {\n  readonly factionA: FactionRef;\n  readonly factionB: FactionRef;",
          )
          s = re.sub(
              r"export interface OperationView \{.*?\n\}",
              '''export interface OperationView {\n  readonly ref: OperationRef;\n  readonly directiveKey?: DirectiveKey;\n  readonly kind: OperationKind;\n  readonly ownerId: FactionRef;\n  readonly targetFactionId?: FactionRef;\n  readonly committedPopulation: number;\n  readonly status: OperationStatus;\n  readonly source?: CellSelector;\n  readonly target?: CellSelector;\n}''',
              s,
              count=1,
              flags=re.S,
          )
          s = s.replace(
              "owner(id: CellId): FactionId | null | undefined;",
              "owner(id: CellId): FactionRef | null | undefined;",
          )
          s = s.replace(
              "get(id: OperationId): OperationView | undefined;",
              "get(ref: OperationRef): OperationView | undefined;",
          )
          s = s.replace(
              "export interface CounterResponseDirective {\n  readonly kind: \"COUNTER_RESPONSE\";\n  readonly key: DirectiveKey;\n  readonly incomingOperationId: OperationId;\n  readonly population: number;\n}",
              "export interface CounterResponseDirective {\n  readonly kind: \"COUNTER_RESPONSE\";\n  readonly key: DirectiveKey;\n  readonly incomingOperation: OperationRef;\n  /** Trusted-runtime compatibility field; player code should use incomingOperation. */\n  readonly incomingOperationId?: OperationId;\n  readonly population: number;\n}",
          )
          s = s.replace(
              "export interface StructuresApi {\n  /** Hidden/unknown/stale/concealed structures collapse to undefined. */\n  get(locator: StructureLocator): Promise<StructureView | undefined>;\n  find(filter?: StructureFindFilter): Promise<QueryPage<StructureView>>;\n  count(filter?: StructureFindFilter): Promise<number>;\n}",
              "export interface StructuresApi {\n  /** Hidden/unknown/stale/concealed structures collapse to undefined. */\n  get(locator: StructureLocator): Promise<StructureView | undefined>;\n  find(filter?: StructureFindFilter): Promise<QueryPage<StructureView>>;\n  count(filter?: StructureFindFilter): Promise<number>;\n  build(type: StructureType, cellId: CellId): ActionRef;\n  upgrade(locator: StructureLocator): ActionRef;\n  checkBuild(type: StructureType, cellId: CellId): StructureBuildQuote;\n  checkUpgrade(locator: StructureLocator): StructureUpgradeQuote;\n}",
          )
          s = s.replace(
              "export interface UnitsApi {\n  /** Hidden/unknown/stale/concealed units collapse to undefined. */\n  get(locator: UnitLocator): Promise<UnitView | undefined>;\n  find(filter?: UnitFindFilter): Promise<QueryPage<UnitView>>;\n  count(filter?: UnitFindFilter): Promise<number>;\n}",
              "export interface UnitsApi {\n  /** Hidden/unknown/stale/concealed units collapse to undefined. */\n  get(locator: UnitLocator): Promise<UnitView | undefined>;\n  find(filter?: UnitFindFilter): Promise<QueryPage<UnitView>>;\n  count(filter?: UnitFindFilter): Promise<number>;\n  build(type: PurchasableUnitType, producer: StructureLocator, destination: CellId): ActionRef;\n  move(unit: UnitLocator, destination: CellId): ActionRef;\n  checkBuild(type: PurchasableUnitType, producer: StructureLocator, destination: CellId): UnitBuildQuote;\n}",
          )
          nav_anchor = "export interface NavigationApi {"
          if "export interface TransportsApi" not in s:
              insert = '''export interface TransportsApi {\n  embark(sourceCellId: CellId, targetCellId: CellId, population: number): ActionRef;\n  recall(unit: UnitLocator): ActionRef;\n  checkEmbark(sourceCellId: CellId, targetCellId: CellId, population: number): TransportEmbarkQuote;\n}\n\nexport interface WeaponsApi {\n  launch(launcher: StructureLocator | UnitLocator, weapon: StrategicWeaponType, targetCellId: CellId, targetFaction?: FactionRef): ActionRef;\n  checkLaunch(launcher: StructureLocator | UnitLocator, weapon: StrategicWeaponType, targetCellId: CellId, targetFaction?: FactionRef): WeaponLaunchQuote;\n}\n\nexport interface TerritoryApi {\n  relinquish(cells: CellSelector): ActionRef;\n  checkRelinquish(cells: CellSelector): RelinquishQuote;\n}\n\nexport interface TeamApi {\n  signal(channel: string, payload: JsonValue): ActionRef;\n}\n\n'''
              s = s.replace(nav_anchor, insert + nav_anchor, 1)
          # Hostile-source event, while keeping existing internal event variants intact.
          marker = "  | {\n      readonly type: \"WAR_STATE_CHANGED\";"
          if "HOSTILE_SOURCE_REVEALED" not in s:
              hostile = '''  | {\n      readonly type: "HOSTILE_SOURCE_REVEALED";\n      readonly source: UnitRef | StructureRef | OperationRef;\n    }\n'''
              s = s.replace(marker, hostile + marker, 1)
          # Raw commands are no longer part of ControllerDecision.
          s = re.sub(r"\n  readonly commands\?: readonly ControllerCommand\[\];", "", s, count=1)
          context_old = '''  readonly operations: OperationsApi;\n  readonly structures: StructuresApi;\n  readonly units: UnitsApi;\n  readonly navigation: NavigationApi;'''
          context_new = '''  readonly operations: OperationsApi;\n  readonly structures: StructuresApi;\n  readonly units: UnitsApi;\n  readonly transports: TransportsApi;\n  readonly weapons: WeaponsApi;\n  readonly territory: TerritoryApi;\n  readonly team: TeamApi;\n  capitulate(): ActionRef;\n  readonly navigation: NavigationApi;'''
          if context_old in s:
              s = s.replace(context_old, context_new, 1)
          write(p, s)

          # Internal authoritative IDs remain available as globals, while no longer exported by public SDK.
          Path("src/core/controller/InternalControllerIds.d.ts").write_text('''declare type FactionId = string;\ndeclare type OperationId = string;\ndeclare type UnitId = string;\ndeclare type StructureId = string;\ndeclare type CommandKey = string;\n''')
          removed = {"FactionId", "OperationId", "UnitId", "StructureId", "CommandKey"}
          imp_re = re.compile(r'import(\s+type)?\s*\{(.*?)\}\s*from\s*("|\')([^"\']*ControllerApi)("|\');', re.S)
          for path in Path("src").rglob("*.ts"):
              if path.as_posix().endswith("ControllerApi.ts"):
                  continue
              text = path.read_text()
              def clean(m):
                  parts = [x.strip() for x in m.group(2).split(',') if x.strip()]
                  kept = []
                  for part in parts:
                      bare = re.sub(r'^type\s+', '', part).strip()
                      bare = bare.split(' as ')[0].strip()
                      if bare in removed:
                          continue
                      kept.append(part)
                  if not kept:
                      return ''
                  prefix = 'import type' if m.group(1) else 'import'
                  return prefix + ' {\n  ' + ',\n  '.join(kept) + ',\n} from ' + m.group(3) + m.group(4) + m.group(5) + ';'
              updated = imp_re.sub(clean, text)
              if updated != text:
                  path.write_text(updated)

          # Query projection: public faction additions, staged structure action, checkBuild accounting.
          p = "src/simulation/ControllerQueryProjection.ts"
          s = read(p)
          s = s.replace(
              "  CellView,\n",
              "  ActionRef,\n  CellView,\n  ControllerCommand,\n",
              1,
          )
          s = s.replace(
              "    readonly status: FactionReadView[\"status\"];\n    readonly relation: FactionReadView[\"relation\"];",
              "    readonly displayName: string;\n    readonly status: FactionReadView[\"status\"];\n    readonly relation: FactionReadView[\"relation\"];\n    readonly isMinorFaction: boolean;\n    readonly score: number;",
              1,
          )
          s = s.replace(
              "  readonly structures: Readonly<{\n    get(locator: StructureLocator): Promise<StructureView | undefined>;\n    find(filter?: StructureFindFilter): Promise<QueryPage<StructureView>>;\n    count(filter?: StructureFindFilter): Promise<number>;\n  }>\;",
              "  readonly structures: Readonly<{\n    get(locator: StructureLocator): Promise<StructureView | undefined>;\n    find(filter?: StructureFindFilter): Promise<QueryPage<StructureView>>;\n    count(filter?: StructureFindFilter): Promise<number>;\n    build(type: StructureType, cellId: CellId): ActionRef;\n    checkBuild(type: StructureType, cellId: CellId): StructureBuildQuote;\n  }>;\n  /** Internal staged actions consumed by the trusted host. */\n  consumeStagedCommands(): readonly ControllerCommand[];",
              1,
          )
          # The exact interface anchor above can vary in spacing; fall back to insertion after count signature.
          if "consumeStagedCommands" not in s:
              s = s.replace(
                  "    count(filter?: StructureFindFilter): Promise<number>;\n  }>;\n  readonly cells:",
                  "    count(filter?: StructureFindFilter): Promise<number>;\n    build(type: StructureType, cellId: CellId): ActionRef;\n    checkBuild(type: StructureType, cellId: CellId): StructureBuildQuote;\n  }>;\n  consumeStagedCommands(): readonly ControllerCommand[];\n  readonly cells:",
                  1,
              )
          # Enrich public faction snapshots.
          s = s.replace(
              "          authoritativeId: faction.id,\n          ref,\n          status: faction.status,\n          relation,",
              "          authoritativeId: faction.id,\n          ref,\n          displayName: faction.id,\n          status: faction.status,\n          relation,\n          isMinorFaction: false,\n          score: 0,",
              1,
          )
          s = s.replace(
              "      ref: source.ref,\n      status: source.status,\n      relation: source.relation,\n      territoryCells:",
              "      ref: source.ref,\n      displayName: source.displayName,\n      status: source.status,\n      relation: source.relation,\n      territoryCells:",
              1,
          )
          s = s.replace(
              "      ...(source.teamId === undefined ? {} : { teamId: source.teamId }),\n    });",
              "      isMinorFaction: source.isMinorFaction,\n      score: source.score,\n      ...(source.teamId === undefined ? {} : { teamId: source.teamId }),\n    });",
              1,
          )
          # Stage facade actions inside the trusted session.
          anchor = "  const countStructures = async (\n    filter?: StructureFindFilter,\n  ): Promise<number> => {\n    beginQuery();\n    entityFindLimit(filter?.limit);\n    return visibleStructures(filter).length;\n  };"
          if anchor in s and "stageStructureBuild" not in s:
              s = s.replace(anchor, anchor + '''\n\n  let nextActionOrdinal = 1;\n  const stagedCommands: ControllerCommand[] = [];\n  const stageStructureBuild = (type: StructureType, cellId: CellId): ActionRef => {\n    const ordinal = nextActionOrdinal;\n    nextActionOrdinal += 1;\n    stagedCommands.push(Object.freeze({\n      kind: "BUILD_STRUCTURE" as const,\n      key: `action:${requesterFactionId}:${ordinal}`,\n      structure: type,\n      cellId,\n    }));\n    return `action_${requesterFactionId}_${ordinal}` as ActionRef;\n  };\n  const checkStructureBuild = (type: StructureType, cellId: CellId): StructureBuildQuote => {\n    beginQuery();\n    return mechanics.structureBuildQuote(type, cellId);\n  };\n  const consumeStagedCommands = (): readonly ControllerCommand[] =>\n    Object.freeze([...stagedCommands]);''')
          s = s.replace(
              "    structures: Object.freeze({\n      get: getStructure,\n      find: findStructures,\n      count: countStructures,\n    }),",
              "    structures: Object.freeze({\n      get: getStructure,\n      find: findStructures,\n      count: countStructures,\n      build: stageStructureBuild,\n      checkBuild: checkStructureBuild,\n    }),\n    consumeStagedCommands,",
              1,
          )
          write(p, s)

          # In-process host exposes the staged facade and rejects player-authored non-empty raw command arrays.
          p = "src/simulation/ControllerRuntime.ts"
          s = read(p)
          s = s.replace(
              "  readonly mechanics?: ControllerQuerySession[\"mechanics\"];\n}",
              "  readonly mechanics?: ControllerQuerySession[\"mechanics\"];\n  readonly structures?: ControllerQuerySession[\"structures\"];\n}",
              1,
          )
          s = s.replace(
              "    mechanics: querySession.mechanics,\n  });",
              "    mechanics: querySession.mechanics,\n    structures: querySession.structures,\n  });",
              1,
          )
          # Wrap normal controller result with trusted staged commands only.
          old = '''    if (typeof registration === "function") {\n      return this.executeInvocation<ControllerDecision>(\n        factionId,\n        "DECIDE",\n        () => registration(inProcessObservation),\n      );\n    }\n\n    return this.executeInvocation<ControllerDecision>(\n      factionId,\n      "DECIDE",\n      (memory) =>\n        registration.decide?.(\n          projectHostedContext(inProcessObservation, memory),\n        ),\n    );'''
          new = '''    const withStagedActions = (output: ControllerDecision | void): ControllerDecision | void => {\n      const rawCommands = (output as unknown as { readonly commands?: readonly unknown[] } | undefined)?.commands;\n      if (rawCommands !== undefined && rawCommands.length > 0) {\n        throw new InvalidControllerValueError("legacy raw controller commands are not accepted");\n      }\n      const staged = querySession?.consumeStagedCommands() ?? [];\n      if (staged.length === 0) return output;\n      return Object.freeze({\n        ...(output ?? {}),\n        commands: staged,\n      }) as unknown as ControllerDecision;\n    };\n\n    if (typeof registration === "function") {\n      return this.executeInvocation<ControllerDecision>(\n        factionId,\n        "DECIDE",\n        () => withStagedActions(registration(inProcessObservation)),\n      );\n    }\n\n    return this.executeInvocation<ControllerDecision>(\n      factionId,\n      "DECIDE",\n      (memory) => withStagedActions(\n        registration.decide?.(\n          projectHostedContext(inProcessObservation, memory),\n        ),\n      ),\n    );'''
          if old in s:
              s = s.replace(old, new, 1)
          s = s.replace(
              "  const commands = decision.commands ?? [];",
              "  const commands = (decision as unknown as { readonly commands?: readonly import(\"../core/controller/ControllerApi\").ControllerCommand[] }).commands ?? [];",
              1,
          )
          write(p, s)

          # Worker transport: copy the already-safe operation snapshot and expose synchronous local reads.
          p = "src/server/controller-runtime/ControllerProcessWorkerPool.ts"
          s = read(p)
          s = s.replace(
              "  ControllerPublicFactionSource,\n  ControllerPublicSpatialSource,",
              "  ControllerPublicFactionSource,\n  ControllerPublicOperationSource,\n  ControllerPublicSpatialSource,",
              1,
          )
          if "type WorkerPublicOperationSnapshot" not in s:
              s = s.replace(
                  "type WorkerPublicFactionSnapshot = Readonly<{\n  requesterOwnerCode?: number;\n  entries: readonly WorkerPublicFactionEntry[];\n}>;",
                  "type WorkerPublicFactionSnapshot = Readonly<{\n  requesterOwnerCode?: number;\n  entries: readonly WorkerPublicFactionEntry[];\n}>;\n\ntype WorkerPublicOperationSnapshot = ControllerPublicOperationSource;",
                  1,
              )
          s = s.replace(
              "  publicFactions?: WorkerPublicFactionSnapshot;\n}>;",
              "  publicFactions?: WorkerPublicFactionSnapshot;\n  publicOperations?: WorkerPublicOperationSnapshot;\n}>;",
              1,
          )
          s = s.replace(
              "      let publicFactions: WorkerPublicFactionSnapshot | undefined;",
              "      let publicFactions: WorkerPublicFactionSnapshot | undefined;\n      let publicOperations: WorkerPublicOperationSnapshot | undefined;",
              1,
          )
          s = s.replace(
              "        publicFactions =\n          queued.querySession?.publicFactions === undefined\n            ? undefined\n            : this.publicFactionSnapshot(\n                queued.querySession.publicFactions,\n                queued.querySession.publicSpatial,\n              );",
              "        publicFactions =\n          queued.querySession?.publicFactions === undefined\n            ? undefined\n            : this.publicFactionSnapshot(\n                queued.querySession.publicFactions,\n                queued.querySession.publicSpatial,\n              );\n        publicOperations = queued.querySession?.publicOperations;",
              1,
          )
          s = s.replace(
              "        ...(publicFactions === undefined ? {} : { publicFactions }),\n      });",
              "        ...(publicFactions === undefined ? {} : { publicFactions }),\n        ...(publicOperations === undefined ? {} : { publicOperations }),\n      });",
              1,
          )
          # Carry new faction public fields into worker snapshot.
          s = s.replace(
              "  ref: string;\n  status: ControllerPublicFactionSource[\"entries\"][number][\"status\"];",
              "  ref: string;\n  displayName: string;\n  status: ControllerPublicFactionSource[\"entries\"][number][\"status\"];",
              1,
          )
          s = s.replace(
              "  territoryCells: number;\n  ownerCode?: number;",
              "  territoryCells: number;\n  isMinorFaction: boolean;\n  score: number;\n  ownerCode?: number;",
              1,
          )
          s = s.replace(
              "            ref: entry.ref,\n            status: entry.status,",
              "            ref: entry.ref,\n            displayName: entry.displayName,\n            status: entry.status,",
              1,
          )
          s = s.replace(
              "            territoryCells:\n              ownership.cellCountByFactionId.get(entry.authoritativeId) ?? 0,",
              "            territoryCells:\n              ownership.cellCountByFactionId.get(entry.authoritativeId) ?? 0,\n            isMinorFaction: entry.isMinorFaction,\n            score: entry.score,",
              1,
          )
          write(p, s)

          p = "src/server/controller-runtime/ControllerWorkerProcess.ts"
          s = read(p)
          # Operation snapshot types/envelope.
          if "type WorkerPublicOperationSnapshot" not in s:
              s = s.replace(
                  "type WorkerPublicFactionSnapshot = Readonly<{\n  requesterOwnerCode?: number;\n  entries: readonly WorkerPublicFactionEntry[];\n}>;",
                  "type WorkerPublicFactionSnapshot = Readonly<{\n  requesterOwnerCode?: number;\n  entries: readonly WorkerPublicFactionEntry[];\n}>;\n\ntype WorkerPublicOperationSnapshot = Readonly<{\n  entries: readonly Readonly<{ direction: \"OWN\" | \"INCOMING\"; view: Readonly<Record<string, unknown>> }>[];\n}>;",
                  1,
              )
          s = s.replace(
              "  publicFactions?: WorkerPublicFactionSnapshot;\n}>;",
              "  publicFactions?: WorkerPublicFactionSnapshot;\n  publicOperations?: WorkerPublicOperationSnapshot;\n}>;",
              1,
          )
          # New public faction fields.
          s = s.replace("  ref: string;\n  status: FactionReadView[\"status\"];", "  ref: string;\n  displayName: string;\n  status: FactionReadView[\"status\"];", 1)
          s = s.replace("  territoryCells: number;\n  ownerCode?: number;", "  territoryCells: number;\n  isMinorFaction: boolean;\n  score: number;\n  ownerCode?: number;", 1)
          # Local operation API inside isolate.
          s = s.replace(
              "  const localFaction = (operation, args) => {\n    consumeQuery();\n    return localRead(operation, args);\n  };",
              "  const localFaction = (operation, args) => {\n    consumeQuery();\n    return localRead(operation, args);\n  };\n  const localOperation = (operation, args) => {\n    consumeQuery();\n    return localRead(operation, args);\n  };",
              1,
          )
          s = s.replace(
              "  const hasEntityReads = $4 === true;",
              "  const hasEntityReads = $4 === true;\n  const hasOperationReads = $6 === true;",
              1,
          )
          op_block = '''    ...(hasOperationReads\n      ? {\n          operations: {\n            get: (ref) => localOperation("OPERATIONS_GET", [ref]),\n            own: () => localOperation("OPERATIONS_OWN", []),\n            incoming: () => localOperation("OPERATIONS_INCOMING", [])\n          }\n        }\n      : {}),\n'''
          if "OPERATIONS_INCOMING" not in s:
              s = s.replace("    ...(hasEntityReads\n      ? {", op_block + "    ...(hasEntityReads\n      ? {", 1)
          # Validate and resolve operation snapshots.
          insertion_anchor = "function activePublicSpatial(cacheKey: number | undefined): WorkerPublicSpatialCache {"
          if "function validatePublicOperationSnapshot" not in s:
              helper = '''function validatePublicOperationSnapshot(value: WorkerPublicOperationSnapshot | undefined): WorkerPublicOperationSnapshot | undefined {\n  if (value === undefined) return undefined;\n  if (!isPlainRecord(value) || !Array.isArray(value.entries)) {\n    throw new Error("controller public operation snapshot is invalid");\n  }\n  return Object.freeze({\n    entries: Object.freeze(value.entries.map((entry) => {\n      if (!isPlainRecord(entry) || (entry.direction !== "OWN" && entry.direction !== "INCOMING") || !isPlainRecord(entry.view) || typeof entry.view.ref !== "string") {\n        throw new Error("controller public operation entry is invalid");\n      }\n      return Object.freeze({ direction: entry.direction, view: Object.freeze({ ...entry.view }) });\n    })),\n  });\n}\n\nfunction resolvePublicOperationRead(operations: WorkerPublicOperationSnapshot, value: unknown): unknown {\n  if (!isPlainRecord(value) || !Array.isArray(value.args)) throw new Error("invalid controller local operation request");\n  const args = value.args;\n  switch (value.operation) {\n    case "OPERATIONS_GET":\n      if (args.length !== 1 || typeof args[0] !== "string") break;\n      return operations.entries.find((entry) => entry.view.ref === args[0])?.view;\n    case "OPERATIONS_OWN":\n      if (args.length !== 0) break;\n      return operations.entries.filter((entry) => entry.direction === "OWN").map((entry) => entry.view);\n    case "OPERATIONS_INCOMING":\n      if (args.length !== 0) break;\n      return operations.entries.filter((entry) => entry.direction === "INCOMING").map((entry) => entry.view);\n  }\n  throw new Error("invalid controller local operation request");\n}\n\n'''
              s = s.replace(insertion_anchor, helper + insertion_anchor, 1)
          s = s.replace(
              "function resolveLocalRead(\n  cacheKey: number | undefined,\n  factions: WorkerPublicFactionSnapshot | undefined,\n  value: unknown,\n): unknown {",
              "function resolveLocalRead(\n  cacheKey: number | undefined,\n  factions: WorkerPublicFactionSnapshot | undefined,\n  operations: WorkerPublicOperationSnapshot | undefined,\n  value: unknown,\n): unknown {",
              1,
          )
          s = s.replace(
              "    if (value.operation.startsWith(\"FACTIONS_\")) {",
              "    if (value.operation.startsWith(\"OPERATIONS_\")) {\n      if (operations === undefined) throw new Error(\"controller public operation snapshot is unavailable\");\n      return resolvePublicOperationRead(operations, value);\n    }\n    if (value.operation.startsWith(\"FACTIONS_\")) {",
              1,
          )
          s = s.replace(
              "  publicFactions: WorkerPublicFactionSnapshot | undefined,\n): Promise<ControllerWorkerResponse> {",
              "  publicFactions: WorkerPublicFactionSnapshot | undefined,\n  publicOperations: WorkerPublicOperationSnapshot | undefined,\n): Promise<ControllerWorkerResponse> {",
              1,
          )
          s = s.replace(
              "      resolveLocalRead(spatialCacheKey, publicFactions, query),",
              "      resolveLocalRead(spatialCacheKey, publicFactions, publicOperations, query),",
              1,
          )
          s = s.replace(
              "          PRODUCTION_CONTROLLER_LIMITS.queriesPerDecision,\n        ],",
              "          PRODUCTION_CONTROLLER_LIMITS.queriesPerDecision,\n          publicOperations !== undefined,\n        ],",
              1,
          )
          s = s.replace(
              "    const publicFactions = validatePublicFactionSnapshot(message.publicFactions);\n    response = await executeRequest(\n      message.requestId,\n      message.request,\n      spatialCacheKey,\n      publicFactions,\n    );",
              "    const publicFactions = validatePublicFactionSnapshot(message.publicFactions);\n    const publicOperations = validatePublicOperationSnapshot(message.publicOperations);\n    response = await executeRequest(\n      message.requestId,\n      message.request,\n      spatialCacheKey,\n      publicFactions,\n      publicOperations,\n    );",
              1,
          )
          # Worker faction materialization/snapshot validation fields.
          s = s.replace(
              "      \"ref\",\n      \"status\",",
