name: Fix memory commit wording

on:
  push:
    branches:
      - docs/determinism-representation-closure

permissions:
  contents: write

jobs:
  fix-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/determinism-representation-closure
          fetch-depth: 0
      - name: Apply wording correction
        run: python .github/scripts/fix_memory_commit_wording.py
      - name: Verify and commit documentation-only correction
        run: |
          set -euo pipefail
          changed="$(git diff --name-only | sort)"
          expected=$'docs/OPENFRONT_INTEGRATION_PLAN.md\ndocs/OPEN_FUFU_DESIGN.md'
          if [[ "$changed" != "$expected" ]]; then
            echo "Unexpected changed files:"
            printf '%s\n' "$changed"
            exit 1
          fi
          git config user.name "open-fufu-doc-sync"
          git config user.email "open-fufu-doc-sync@users.noreply.github.com"
          git add docs/OPENFRONT_INTEGRATION_PLAN.md docs/OPEN_FUFU_DESIGN.md
          git rm .github/workflows/fix-memory-commit-wording.yml .github/scripts/fix_memory_commit_wording.py
          git commit -m "docs: align memory and gameplay commit semantics"
          git push origin HEAD:docs/determinism-representation-closure
