name: Determinism representation documentation sync

on:
  push:
    branches:
      - docs/determinism-representation-closure

permissions:
  contents: write

jobs:
  sync-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/determinism-representation-closure
          fetch-depth: 0

      - name: Apply accepted documentation specifications
        run: python .github/scripts/apply_determinism_representation_docs.py

      - name: Verify documentation-only diff
        run: |
          set -euo pipefail
          changed="$(git diff --name-only | sort)"
          expected=$'docs/CONTROLLER_MEMORY.md\ndocs/Maps.md\ndocs/OPENFRONT_INTEGRATION_PLAN.md\ndocs/OPEN_FUFU_DESIGN.md\ndocs/SEGMENTS.md\ndocs/STRATEGIC_SPAWN.md'
          if [[ "$changed" != "$expected" ]]; then
            echo "Unexpected changed files:"
            printf '%s\n' "$changed"
            exit 1
          fi

      - name: Commit canonical documentation and remove temporary tooling
        run: |
          set -euo pipefail
          git config user.name "open-fufu-doc-sync"
          git config user.email "open-fufu-doc-sync@users.noreply.github.com"
          git add docs/CONTROLLER_MEMORY.md docs/Maps.md docs/OPENFRONT_INTEGRATION_PLAN.md docs/OPEN_FUFU_DESIGN.md docs/SEGMENTS.md docs/STRATEGIC_SPAWN.md
          git rm .github/workflows/apply-determinism-representation-docs.yml .github/scripts/apply_determinism_representation_docs.py
          git commit -m "docs: close determinism and representation specifications"
          git push origin HEAD:docs/determinism-representation-closure
