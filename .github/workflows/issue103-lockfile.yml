name: "OF-ISSUE103-20260908-18570D Temporary lockfile cleanup"

on:
  push:
    branches:
      - issue-103-isolated-controller-host-OF-ISSUE103-20260908-18570D
    paths:
      - .github/workflows/issue103-lockfile.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Remove temporary workflow and ownership registration
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "R-Andrei"
          git config user.email "30163089+R-Andrei@users.noreply.github.com"

          python3 - <<'PY'
          import json
          from pathlib import Path

          manifest_path = Path("validation/open-fufu-owned.json")
          manifest = json.loads(manifest_path.read_text())
          workflow = ".github/workflows/issue103-lockfile.yml"
          if workflow not in manifest["ownedWorkflows"]:
              raise SystemExit(f"expected owned workflow registration missing: {workflow}")
          manifest["ownedWorkflows"].remove(workflow)
          manifest_path.write_text(json.dumps(manifest, indent=2) + "\n")
          PY

          git rm .github/workflows/issue103-lockfile.yml
          git add validation/open-fufu-owned.json
          git commit \
            -m "OF-ISSUE103-20260908-18570D Remove temporary lockfile helper" \
            -m "Finding: the exact isolated-vm 6.2.0 package and lock state is committed, so the temporary workflow and its ownership registration are no longer needed." \
            -m "Conclusion: remove both temporary artifacts atomically; no durable workflow is added by issue #103." \
            -m "Recommended next action: implement the isolated process worker GREEN against the already-proven ControllerSandbox RED contract."
          git push origin "HEAD:${GITHUB_REF_NAME}"
