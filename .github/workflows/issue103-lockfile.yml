name: "OF-ISSUE103-20260908-18570D Temporary lockfile generator"

on:
  push:
    branches:
      - issue-103-isolated-controller-host-OF-ISSUE103-20260908-18570D
    paths:
      - .github/workflows/issue103-lockfile.yml

permissions:
  contents: write

jobs:
  generate-lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Generate exact isolated-vm lock state
        shell: bash
        run: |
          set -euo pipefail
          npm install --package-lock-only --ignore-scripts --save-exact isolated-vm@6.2.0
          node <<'NODE'
          const fs = require('node:fs');
          const path = 'package.json';
          const pkg = JSON.parse(fs.readFileSync(path, 'utf8'));
          pkg.allowScripts = {
            ...(pkg.allowScripts ?? {}),
            'isolated-vm@6.2.0': true,
          };
          fs.writeFileSync(path, `${JSON.stringify(pkg, null, 2)}\n`);
          NODE
          git config user.name "R-Andrei"
          git config user.email "30163089+R-Andrei@users.noreply.github.com"
          git add package.json package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "OF-ISSUE103-20260908-18570D Pin isolated-vm 6.2.0 lockfile"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
