name: 📚 Documentation Authority

on:
  pull_request:
    paths:
      - "docs/**"
      - "AGENTS.md"
      - "scripts/checkDocumentationAuthority.ts"
      - ".github/workflows/documentation-authority.yml"
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "AGENTS.md"
      - "scripts/checkDocumentationAuthority.ts"
      - ".github/workflows/documentation-authority.yml"

permissions:
  contents: read

jobs:
  authority:
    name: Canonical authority guard
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Setup node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Validate canonical ownership and prevent new drift
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            npx tsx scripts/checkDocumentationAuthority.ts --base "origin/${{ github.base_ref }}"
          else
            npx tsx scripts/checkDocumentationAuthority.ts --base "${{ github.event.before }}"
          fi
