name: 📚 Documentation Authority

on:
  merge_group:
    types:
      - checks_requested
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  phase6-numbering-autofix:
    if: github.event_name == 'pull_request' && github.event.pull_request.number == 67 && github.event.pull_request.head.repo.full_name == github.repository
    name: Temporary Phase 6 numbering autofix
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - name: Rewrite non-GitHub number notation
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          replacements = {
              Path('docs/MINOR_FACTIONS.md'): [('Goon #37', 'Goon ID 37')],
              Path('docs/NAVAL_AND_STRATEGIC_WEAPONS.md'): [('Warhead #1 targets', 'The first warhead targets')],
          }
          for path, pairs in replacements.items():
              text = path.read_text()
              for old, new in pairs:
                  if text.count(old) != 1:
                      raise SystemExit(f'{path}: expected exactly one {old!r}')
                  text = text.replace(old, new)
              path.write_text(text)
          PY
          if git diff --quiet -- docs/MINOR_FACTIONS.md docs/NAVAL_AND_STRATEGIC_WEAPONS.md; then
            echo 'Numbering rewrites already applied.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/MINOR_FACTIONS.md docs/NAVAL_AND_STRATEGIC_WEAPONS.md
          git commit -m 'docs: disambiguate numeric examples for strict authority guard'
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"

  authority:
    name: Canonical authority guard
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Setup node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Validate canonical ownership strictly
        run: npx tsx scripts/checkDocumentationAuthority.ts --strict
      - name: Phase 6 stale-reference diagnostic
        shell: bash
        run: |
          set +e
          echo '=== GitHub issue/PR references in tracked text ==='
          git grep -nE '(^|[^A-Za-z0-9_])#[0-9]+\b|https://github\.com/[^/[:space:])]+/[^/[:space:])]+/(issues|pull)/[0-9]+\b' -- '*.md' '*.ts' '*.tsx' '*.js' '*.mjs' '*.yml' '*.yaml' '*.json'
          echo '=== TODO/FIXME in tracked text ==='
          git grep -nE '\b(TODO|FIXME)\b' -- '*.md' '*.ts' '*.tsx' '*.js' '*.mjs' '*.yml' '*.yaml' '*.json'
          echo '=== Deleted Origin-validation document references ==='
          git grep -nE 'FINAL_VALIDATION_MODEL\.md|origin-validation/(P41-P50|P51-P54|N01-N10|N11-N18)\.md'
          echo '=== Known stale authority/status phrases ==='
          git grep -niE 'sole active workflow|72/72|49/49|20/20|phase closed|closure status|implementation/content work still open|remaining implementation/validation work|remaining migration work'
          exit 0
