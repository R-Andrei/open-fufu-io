name: Issue 51 repair runner

on:
  push:
    branches:
      - issue-51/of-issue51-20260907-cccaaa-observation-contract
    paths:
      - .github/workflows/issue51-repair.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    env:
      CLAIM_ID: OF-ISSUE51-20260907-cccaaa
      TOPIC_BRANCH: issue-51/of-issue51-20260907-cccaaa-observation-contract
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: issue-51/of-issue51-20260907-cccaaa-observation-contract
          fetch-depth: 0

      - name: Fresh repository rules and ownership guard
        shell: bash
        run: |
          set -euo pipefail
          cat AGENTS.md >/dev/null
          test "${GITHUB_REF_NAME}" = "${TOPIC_BRANCH}"
          comments="$(gh api "repos/${GITHUB_REPOSITORY}/issues/51/comments" --paginate --jq '.[].body')"
          grep -F "${CLAIM_ID}" <<<"${comments}" >/dev/null
          grep -F 'Branch registration: `issue-51/of-issue51-20260907-cccaaa-observation-contract`' <<<"${comments}" >/dev/null
          test "$(gh api "repos/${GITHUB_REPOSITORY}/pulls/74" --jq '.head.ref')" = "${TOPIC_BRANCH}"
          gh api "repos/${GITHUB_REPOSITORY}/pulls/74" --jq '.body' | grep -F "${CLAIM_ID}" >/dev/null

      - name: Apply exact contract repairs
        shell: bash
        run: |
          set -euo pipefail
          cat AGENTS.md >/dev/null
          python3 <<'PY'
          from pathlib import Path

          def replace_exact(path: str, old: str, new: str, count: int = 1) -> None:
              p = Path(path)
              text = p.read_text()
              actual = text.count(old)
              if actual != count:
                  raise SystemExit(f"{path}: expected {count} occurrence(s), found {actual}: {old[:100]!r}")
              p.write_text(text.replace(old, new))

          replace_exact(
              "docs/OPEN_FUFU_DESIGN.md",
              "A **direct hostile manifestation** occurs only when the authoritative simulation actually resolves a hostile effect from an identifiable unit, structure, or operation against another faction. Target selection, tracking, prospective acquisition, rejected/failed actions, movement, and other private intent are not manifestations and reveal nothing. Each faction whose owned state is actually targeted or affected receives the direct reveal independently; unrelated third parties receive no reveal merely because the action occurred.",
              "A **direct hostile manifestation** occurs only when the authoritative simulation actually resolves a hostile effect from an identifiable unit, structure, or operation against another faction. Target selection, tracking, prospective acquisition, rejected/failed actions, movement, and other private intent are not manifestations and reveal nothing. Each faction to which that resolved manifestation itself is lawfully observable receives the direct reveal independently. An affected faction is therefore a recipient, and an independent third-party witness receives the reveal only when the same manifestation is lawfully observable to that viewer; a faction that does not lawfully observe the manifestation receives no reveal merely because the action occurred.",
          )

          replace_exact(
              "docs/TERRAIN_AND_STRUCTURES.md",
              """### Observation Post

          Reveals legally revealable operational state inside its completed-level radius, including hostile mobile units, persistent structures, and manifested operations needed for tactical decisions.

          It never reveals controller memory, unmanifested plans, hidden private state, or information outside the surfaced visibility model. Observation coverage is boolean; overlapping Posts do not stack.""",
              """### Observation Post

          An active Observation Post projects the canonical `OBSERVATION` structure field using its currently active completed-level effective observation radius and `STRUCTURE_RADIAL_FIELD_V1`. Its ordinary effect is `REVEAL`: inside that field, the owning faction gains remote observation of tactical operational state that is otherwise legally revealable under the requester-relative visibility projection in `OPEN_FUFU_DESIGN.md`, including hostile mobile units, persistent structures, and manifested operations needed for tactical decisions.

          Observation is not a hidden-state bypass. An applicable concealment/blackout predicate remains higher-precedence than remote observation, and the Post never reveals controller memory, unmanifested plans, hidden private state, or information outside the surfaced visibility model. Observation coverage is boolean; overlapping Posts form a union and do not stack reveal strength.

          Origin transformations may replace the Observation field's ordinary effect, but they consume this same effective `OBSERVATION` field rather than defining a second radius or raster footprint. Exact Origin transformations are owned by `ORIGIN_TRAIT_CATALOGUE.md`.""",
          )

          replace_exact(
              "src/core/visibility/TacticalVisibility.ts",
              " * Hostile manifestation refresh is keyed by source identity and affected viewer,\n * so movement never clears the reveal and unrelated factions gain no reveal.",
              " * Hostile manifestation refresh is keyed by source identity and lawful viewer,\n * so movement never clears the reveal and unrelated factions gain no reveal.",
          )
          replace_exact(
              "src/core/visibility/TacticalVisibility.ts",
              "  /** Factions whose owned state was actually targeted or affected. */\n  readonly affectedFactionIds: readonly string[];",
              "  /**\n   * Factions to which the resolved manifestation itself is lawfully observable,\n   * including affected factions and any independent lawful witnesses.\n   */\n  readonly observingFactionIds: readonly string[];",
          )
          replace_exact(
              "src/core/visibility/TacticalVisibility.ts",
              "manifestation.affectedFactionIds.filter",
              "manifestation.observingFactionIds.filter",
          )

          replace_exact(
              "tests/TacticalVisibility.test.ts",
              "affectedFactionIds:",
              "observingFactionIds:",
              count=4,
          )
          replace_exact(
              "tests/TacticalVisibility.test.ts",
              """  it(\"reveals independently to every actually affected faction and nobody else\", () => {
            expect(
              directRevealRecipients({
                resolved: true,
                hostile: true,
                identifiableSource: true,
                observingFactionIds: [\"C\", \"B\", \"B\"],
              }),
            ).toEqual([\"B\", \"C\"]);
          });""",
              """  it(\"reveals independently to every lawful manifestation observer and nobody else\", () => {
            const recipients = directRevealRecipients({
              resolved: true,
              hostile: true,
              identifiableSource: true,
              // B is affected; C is an independent lawful witness; D is unrelated.
              observingFactionIds: [\"C\", \"B\", \"B\"],
            });
            expect(recipients).toEqual([\"B\", \"C\"]);
            expect(recipients).not.toContain(\"D\");
          });""",
          )

          replace_exact(
              "tests/ObservationFieldVocabulary.test.ts",
              """import type {
            CellSelector,
            ControllerStructureFieldId,
          } from \"../src/core/controller/ControllerApi\";""",
              """import type {
            CellSelector,
            ControllerStructureFieldId,
            ObservationStructureEffect,
          } from \"../src/core/controller/ControllerApi\";""",
          )
          replace_exact(
              "tests/ObservationFieldVocabulary.test.ts",
              """    expect(selector.field).toBe(\"OBSERVATION\");
            expect(STRUCTURE_FIELD_IDS).not.toContain(\"OBSERVATION\");
          });
          });""",
              """    expect(selector.field).toBe(\"OBSERVATION\");
            expect(STRUCTURE_FIELD_IDS).not.toContain(\"OBSERVATION\");
          });

            it(\"surfaces ordinary reveal and transformed blackout effects\", () => {
              const reveal: ObservationStructureEffect = \"REVEAL\";
              const blackout: ObservationStructureEffect = \"ENEMY_BLACKOUT\";

              expect(reveal).toBe(\"REVEAL\");
              expect(blackout).toBe(\"ENEMY_BLACKOUT\");
            });
          });""",
          )

          replace_exact(
              "design/official-ai/origin-configurations.config.ts",
              '"FOREST_INTERIOR_CONCEALMENT"',
              '"OWNED_FOREST_CONCEALMENT"',
              count=2,
          )
          replace_exact(
              "docs/official-ai/OFFICIAL_AI_ORIGIN_CONFIGURATIONS.md",
              "owned Forest interiors",
              "owned Forest cells",
              count=2,
          )
          PY

          if grep -R -n --exclude-dir=.git --exclude-dir=node_modules -E 'FOREST_INTERIOR_CONCEALMENT|owned Forest interiors|affectedFactionIds' .; then
            echo "stale issue-51 terminology remains" >&2
            exit 1
          fi
          git diff --check

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install and validate
        shell: bash
        run: |
          set -euo pipefail
          cat AGENTS.md >/dev/null
          npm ci
          npm test
          npx tsx scripts/checkDocumentationAuthority.ts --strict

      - name: Commit validated repair and remove runner
        shell: bash
        run: |
          set -euo pipefail
          cat AGENTS.md >/dev/null
          comments="$(gh api "repos/${GITHUB_REPOSITORY}/issues/51/comments" --paginate --jq '.[].body')"
          grep -F "${CLAIM_ID}" <<<"${comments}" >/dev/null
          grep -F 'Branch registration: `issue-51/of-issue51-20260907-cccaaa-observation-contract`' <<<"${comments}" >/dev/null
          test "$(gh api "repos/${GITHUB_REPOSITORY}/pulls/74" --jq '.head.ref')" = "${TOPIC_BRANCH}"
          gh api "repos/${GITHUB_REPOSITORY}/pulls/74" --jq '.body' | grep -F "${CLAIM_ID}" >/dev/null
          rm .github/workflows/issue51-repair.yml
          git diff --check
          git status --short
          git add \
            docs/OPEN_FUFU_DESIGN.md \
            docs/TERRAIN_AND_STRUCTURES.md \
            src/core/visibility/TacticalVisibility.ts \
            tests/TacticalVisibility.test.ts \
            tests/ObservationFieldVocabulary.test.ts \
            design/official-ai/origin-configurations.config.ts \
            docs/official-ai/OFFICIAL_AI_ORIGIN_CONFIGURATIONS.md \
            .github/workflows/issue51-repair.yml
          cat AGENTS.md >/dev/null
          git config user.name "R-Andrei"
          git config user.email "30163089+R-Andrei@users.noreply.github.com"
          git commit -m "${CLAIM_ID}: repair tactical visibility observation contracts" -m "${CLAIM_ID}

Conclusion: align direct reveal with lawful manifestation observers, make baseline Observation semantics explicit, and remove stale Forest-interior AI vocabulary.
Recommendation: run normal PR CI and final authority/current-main audits before merging PR #74."
          git push origin "HEAD:${TOPIC_BRANCH}"
