name: Issue 51 guarded repair runner

"on":
  push:
    branches:
      - "issue-51/of-issue51-20260907-cccaaa-observation-contract"

permissions:
  contents: write
  issues: read
  pull-requests: read

jobs:
  repair:
    runs-on: ubuntu-latest
    env:
      CLAIM_ID: OF-ISSUE51-20260907-cccaaa
      TOPIC_BRANCH: issue-51/of-issue51-20260907-cccaaa-observation-contract
    steps:
      - uses: actions/checkout@v4
        with:
          ref: issue-51/of-issue51-20260907-cccaaa-observation-contract
          fetch-depth: 0

      - name: Fresh rules and ownership guard
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cat AGENTS.md >/dev/null
          test "${GITHUB_REF_NAME}" = "${TOPIC_BRANCH}"
          comments="$(gh api "repos/${GITHUB_REPOSITORY}/issues/51/comments" --paginate --jq '.[].body')"
          grep -F "${CLAIM_ID}" <<<"${comments}" >/dev/null
          grep -F 'Branch registration: `issue-51/of-issue51-20260907-cccaaa-observation-contract`' <<<"${comments}" >/dev/null
          test "$(gh api "repos/${GITHUB_REPOSITORY}/pulls/74" --jq '.head.ref')" = "${TOPIC_BRANCH}"
          gh api "repos/${GITHUB_REPOSITORY}/pulls/74" --jq '.body' | grep -F "${CLAIM_ID}" >/dev/null

      - name: Apply exact contract repairs
        shell: bash
        run: |
          set -euo pipefail
          cat AGENTS.md >/dev/null
          python3 <<'PY'
          from pathlib import Path

          def replace_exact(path: str, old: str, new: str, count: int = 1) -> None:
              p = Path(path)
              text = p.read_text()
              actual = text.count(old)
              if actual != count:
                  raise SystemExit(f"{path}: expected {count} occurrence(s), found {actual}: {old!r}")
              p.write_text(text.replace(old, new))

          # Game-wide direct-reveal recipient rule: affected factions plus lawful witnesses.
          replace_exact(
              "docs/OPEN_FUFU_DESIGN.md",
              "Each faction whose owned state is actually targeted or affected receives the direct reveal independently; unrelated third parties receive no reveal merely because the action occurred.",
              "Each faction to which that resolved manifestation itself is lawfully observable receives the direct reveal independently. An affected faction is therefore a recipient, and an independent third-party witness receives the reveal only when the same manifestation is lawfully observable to that viewer; a faction that does not lawfully observe the manifestation receives no reveal merely because the action occurred.",
          )

          # Baseline Observation Post owns the ordinary OBSERVATION/REVEAL field semantics.
          replace_exact(
              "docs/TERRAIN_AND_STRUCTURES.md",
              "Reveals legally revealable operational state inside its completed-level radius, including hostile mobile units, persistent structures, and manifested operations needed for tactical decisions.",
              "An active Observation Post projects the canonical `OBSERVATION` structure field using its currently active completed-level effective observation radius and `STRUCTURE_RADIAL_FIELD_V1`. Its ordinary effect is `REVEAL`: inside that field, the owning faction gains remote observation of tactical operational state that is otherwise legally revealable under the requester-relative visibility projection in `OPEN_FUFU_DESIGN.md`, including hostile mobile units, persistent structures, and manifested operations needed for tactical decisions.",
          )
          replace_exact(
              "docs/TERRAIN_AND_STRUCTURES.md",
              "It never reveals controller memory, unmanifested plans, hidden private state, or information outside the surfaced visibility model. Observation coverage is boolean; overlapping Posts do not stack.",
              "Observation is not a hidden-state bypass. An applicable concealment/blackout predicate remains higher-precedence than remote observation, and the Post never reveals controller memory, unmanifested plans, hidden private state, or information outside the surfaced visibility model. Observation coverage is boolean; overlapping Posts form a union and do not stack reveal strength.\n\nOrigin transformations may replace the Observation field's ordinary effect, but they consume this same effective `OBSERVATION` field rather than defining a second radius or raster footprint. Exact Origin transformations are owned by `ORIGIN_TRAIT_CATALOGUE.md`.",
          )

          # Executable direct-reveal input is the lawful observer set, not affected-only factions.
          replace_exact(
              "src/core/visibility/TacticalVisibility.ts",
              "Hostile manifestation refresh is keyed by source identity and affected viewer,",
              "Hostile manifestation refresh is keyed by source identity and lawful viewer,",
          )
          replace_exact(
              "src/core/visibility/TacticalVisibility.ts",
              "  /** Factions whose owned state was actually targeted or affected. */\n  readonly affectedFactionIds: readonly string[];",
              "  /**\n   * Factions to which the resolved manifestation itself is lawfully observable,\n   * including affected factions and any independent lawful witnesses.\n   */\n  readonly observingFactionIds: readonly string[];",
          )
          replace_exact(
              "src/core/visibility/TacticalVisibility.ts",
              "manifestation.affectedFactionIds.filter",
              "manifestation.observingFactionIds.filter",
          )

          # Focused tests use the lawful observer vocabulary and explicitly cover a third-party witness.
          replace_exact(
              "tests/TacticalVisibility.test.ts",
              "affectedFactionIds:",
              "observingFactionIds:",
              count=4,
          )
          replace_exact(
              "tests/TacticalVisibility.test.ts",
              "reveals independently to every actually affected faction and nobody else",
              "reveals independently to every lawful manifestation observer and nobody else",
          )
          replace_exact(
              "tests/TacticalVisibility.test.ts",
              "  it(\"lets active direct reveal pierce overlapping concealment without exposing neighbors\", () => {",
              """  it(\"includes an independent lawful witness without leaking to a non-observer\", () => {
            const recipients = directRevealRecipients({
              resolved: true,
              hostile: true,
              identifiableSource: true,
              // B is affected; C independently observes the resolved manifestation.
              observingFactionIds: [\"B\", \"C\"],
            });
            expect(recipients).toEqual([\"B\", \"C\"]);
            expect(recipients).not.toContain(\"D\");
          });

          it(\"lets active direct reveal pierce overlapping concealment without exposing neighbors\", () => {""",
          )

          # Controller API already owns REVEAL/ENEMY_BLACKOUT; test both without widening rule-condition fields.
          replace_exact(
              "tests/ObservationFieldVocabulary.test.ts",
              "  ControllerStructureFieldId,\n} from \"../src/core/controller/ControllerApi\";",
              "  ControllerStructureFieldId,\n  ObservationStructureEffect,\n} from \"../src/core/controller/ControllerApi\";",
          )
          replace_exact(
              "tests/ObservationFieldVocabulary.test.ts",
              """  });
          });
          """,
              """  });

            it(\"surfaces ordinary reveal and transformed blackout effects\", () => {
              const reveal: ObservationStructureEffect = \"REVEAL\";
              const blackout: ObservationStructureEffect = \"ENEMY_BLACKOUT\";

              expect(reveal).toBe(\"REVEAL\");
              expect(blackout).toBe(\"ENEMY_BLACKOUT\");
            });
          });
          """,
          )

          # Named-Origin AI consumers must match the all-owned-Forest P45 mechanic.
          replace_exact(
              "design/official-ai/origin-configurations.config.ts",
              '"FOREST_INTERIOR_CONCEALMENT"',
              '"OWNED_FOREST_CONCEALMENT"',
              count=2,
          )
          replace_exact(
              "docs/official-ai/OFFICIAL_AI_ORIGIN_CONFIGURATIONS.md",
              "owned Forest interiors",
              "owned Forest cells",
              count=2,
          )
          PY

          if grep -R -n --exclude-dir=.git --exclude-dir=node_modules -E 'FOREST_INTERIOR_CONCEALMENT|owned Forest interiors|affectedFactionIds' .; then
            echo "stale issue-51 terminology remains" >&2
            exit 1
          fi
          git diff --check

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install and validate
        shell: bash
        run: |
          set -euo pipefail
          cat AGENTS.md >/dev/null
          npm ci
          npm test
          npx tsx scripts/checkDocumentationAuthority.ts --strict

      - name: Recheck ownership, commit repair, and remove runner
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cat AGENTS.md >/dev/null
          comments="$(gh api "repos/${GITHUB_REPOSITORY}/issues/51/comments" --paginate --jq '.[].body')"
          grep -F "${CLAIM_ID}" <<<"${comments}" >/dev/null
          grep -F 'Branch registration: `issue-51/of-issue51-20260907-cccaaa-observation-contract`' <<<"${comments}" >/dev/null
          test "$(gh api "repos/${GITHUB_REPOSITORY}/pulls/74" --jq '.head.ref')" = "${TOPIC_BRANCH}"
          gh api "repos/${GITHUB_REPOSITORY}/pulls/74" --jq '.body' | grep -F "${CLAIM_ID}" >/dev/null

          rm .github/workflows/issue51-repair.yml
          git diff --check
          git add \
            docs/OPEN_FUFU_DESIGN.md \
            docs/TERRAIN_AND_STRUCTURES.md \
            src/core/visibility/TacticalVisibility.ts \
            tests/TacticalVisibility.test.ts \
            tests/ObservationFieldVocabulary.test.ts \
            design/official-ai/origin-configurations.config.ts \
            docs/official-ai/OFFICIAL_AI_ORIGIN_CONFIGURATIONS.md \
            .github/workflows/issue51-repair.yml

          cat AGENTS.md >/dev/null
          git config user.name "R-Andrei"
          git config user.email "30163089+R-Andrei@users.noreply.github.com"
          git commit \
            -m "${CLAIM_ID}: repair tactical visibility observation contracts" \
            -m "${CLAIM_ID}

          Conclusion: align direct reveal with lawful manifestation observers, make baseline Observation semantics explicit, and remove stale Forest-interior AI vocabulary.
          Recommendation: run normal PR CI and final authority/current-main audits before merging PR #74."
          git push origin "HEAD:${TOPIC_BRANCH}"
