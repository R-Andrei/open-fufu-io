name: Delete merged PR branch

on:
  pull_request:
    types: [closed]

permissions:
  contents: write

jobs:
  delete-head-branch:
    if: >-
      github.event.pull_request.merged == true &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref != github.event.repository.default_branch
    runs-on: ubuntu-latest
    steps:
      - name: Delete merged remote head branch
        uses: actions/github-script@v8
        with:
          script: |
            const ref = `heads/${context.payload.pull_request.head.ref}`;
            try {
              await github.rest.git.deleteRef({
                ...context.repo,
                ref,
              });
              core.info(`Deleted remote branch ${context.payload.pull_request.head.ref}`);
            } catch (error) {
              // Native GitHub automatic branch deletion may already have removed it.
              if (error.status === 404 || error.status === 422) {
                core.info(`Remote branch already absent: ${context.payload.pull_request.head.ref}`);
                return;
              }
              throw error;
            }
