name: Canonize water-nuke documentation

on:
  push:
    branches:
      - docs/water-nukes-closure

permissions:
  contents: write

jobs:
  patch-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/water-nukes-closure
          fetch-depth: 0
      - name: Apply accepted Water Nukes specification
        run: python .github/scripts/canonize_water_nukes_v3.py
      - name: Commit documentation only
        run: |
          set -euo pipefail
          git config user.name "open-fufu-doc-sync"
          git config user.email "open-fufu-doc-sync@users.noreply.github.com"
          git add docs/NAVAL_AND_STRATEGIC_WEAPONS.md docs/OPENFRONT_INTEGRATION_PLAN.md docs/OPEN_FUFU_DESIGN.md
          if git diff --cached --quiet; then
            echo "Water Nukes patch produced no documentation changes"
            exit 1
          fi
          git commit -m "docs: close Water Nukes V1 ruleset"
          git push origin HEAD:docs/water-nukes-closure
