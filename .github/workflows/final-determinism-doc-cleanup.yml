name: Final determinism documentation cleanup

on:
  push:
    branches:
      - docs/determinism-representation-closure

permissions:
  contents: write

jobs:
  cleanup-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/determinism-representation-closure
          fetch-depth: 0
      - name: Apply final cleanup
        run: python .github/scripts/final_determinism_doc_cleanup.py
      - name: Verify and commit documentation-only cleanup
        run: |
          set -euo pipefail
          changed="$(git diff --name-only | sort)"
          expected=$'docs/OPENFRONT_INTEGRATION_PLAN.md\ndocs/OPEN_FUFU_DESIGN.md'
          if [[ "$changed" != "$expected" ]]; then
            echo "Unexpected changed files:"
            printf '%s\n' "$changed"
            exit 1
          fi
          git config user.name "open-fufu-doc-sync"
          git config user.email "open-fufu-doc-sync@users.noreply.github.com"
          git add docs/OPENFRONT_INTEGRATION_PLAN.md docs/OPEN_FUFU_DESIGN.md
          git rm .github/workflows/final-determinism-doc-cleanup.yml .github/scripts/final_determinism_doc_cleanup.py
          git commit -m "docs: finalize determinism closure backlog"
          git push origin HEAD:docs/determinism-representation-closure
