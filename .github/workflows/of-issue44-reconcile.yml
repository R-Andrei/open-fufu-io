name: OF-ISSUE44 reconciliation helper

on:
  push:
    branches:
      - issue-44/of-issue44-20260907-a91c7f-affiliation-followup

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: issue-44/of-issue44-20260907-a91c7f-affiliation-followup
          fetch-depth: 0

      - name: Apply exact post-main reconciliation
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          replacements = {
              "src/core/controller/ControllerApi.ts": [
                  ('Extract<StructureFieldId, "SAM">', 'Extract<StructureFieldId, "SAM_LAUNCHER">'),
              ],
              "tests/ControllerApiContract.test.ts": [
                  ('eligibilityField: "SAM",', 'eligibilityField: "SAM_LAUNCHER",'),
              ],
              "tests/ControllerStructureFieldProjection.test.ts": [
                  ('Extract<StructureFieldId, \\"SAM\\">;', 'Extract<StructureFieldId, \\"SAM_LAUNCHER\\">;'),
              ],
              "docs/NAVAL_AND_STRATEGIC_WEAPONS.md": [
                  ('effective `SAM` structure field', 'effective `SAM_LAUNCHER` structure field'),
                  ('authoritative `SAM` structure-field projection', 'authoritative `SAM_LAUNCHER` structure-field projection'),
              ],
          }

          for filename, pairs in replacements.items():
              path = Path(filename)
              text = path.read_text(encoding="utf-8")
              for old, new in pairs:
                  count = text.count(old)
                  if count != 1:
                      raise SystemExit(f"{filename}: expected exactly one {old!r}, found {count}")
                  text = text.replace(old, new)
              path.write_text(text, encoding="utf-8")

          Path(".github/workflows/of-issue44-reconcile.yml").unlink()
          PY

          git diff --check
          git config user.name "Fufuway"
          git config user.email "faragau.rares@gmail.com"
          git add -A
          git commit \
            -m "OF-ISSUE44-20260907-A91C7F: reconcile P27 with canonical SAM launcher field identity" \
            -m "Conclusion: the post-base P27 surfaces must consume schema-v3 SAM_LAUNCHER rather than the retired SAM machine token while preserving all P27 mechanics. Recommendation: validate the reconciled current-main candidate and merge #80 only if the exact head remains clean."
          git push origin HEAD:issue-44/of-issue44-20260907-a91c7f-affiliation-followup
