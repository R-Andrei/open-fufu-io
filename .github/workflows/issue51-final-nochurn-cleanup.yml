name: Issue 51 final no-churn cleanup

"on":
  push:
    branches:
      - "issue-51/of-issue51-20260907-cccaaa-observation-contract"

permissions:
  contents: write
  issues: read
  pull-requests: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    env:
      CLAIM_ID: OF-ISSUE51-20260907-cccaaa
      TOPIC_BRANCH: issue-51/of-issue51-20260907-cccaaa-observation-contract
      TARGET_MAIN_SHA: 79d93f77e8e80faa2beb82e35993acb19e5d3987
      WORKFLOW_PATH: .github/workflows/issue51-final-nochurn-cleanup.yml
    steps:
      - uses: actions/checkout@v4
        with:
          ref: issue-51/of-issue51-20260907-cccaaa-observation-contract
          fetch-depth: 0

      - name: Fresh rules, claim, branch, PR, and base guard
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cat AGENTS.md >/dev/null
          test "${GITHUB_REF_NAME}" = "${TOPIC_BRANCH}"
          comments="$(gh api "repos/${GITHUB_REPOSITORY}/issues/51/comments" --paginate --jq '.[].body')"
          grep -F "${CLAIM_ID}" <<<"${comments}" >/dev/null
          grep -F 'Branch registration: `issue-51/of-issue51-20260907-cccaaa-observation-contract`' <<<"${comments}" >/dev/null
          test "$(gh api "repos/${GITHUB_REPOSITORY}/pulls/74" --jq '.head.ref')" = "${TOPIC_BRANCH}"
          gh api "repos/${GITHUB_REPOSITORY}/pulls/74" --jq '.body' | grep -F "${CLAIM_ID}" >/dev/null
          test "$(gh api "repos/${GITHUB_REPOSITORY}/branches/main" --jq '.commit.sha')" = "${TARGET_MAIN_SHA}"
          git fetch origin main
          test "$(git rev-parse origin/main)" = "${TARGET_MAIN_SHA}"

      - name: Fresh canonical-owner reads from exact target base
        shell: bash
        run: |
          set -euo pipefail
          cat AGENTS.md >/dev/null
          owners=(
            docs/README.md
            docs/OPEN_FUFU_DESIGN.md
            docs/RULE_COMPOSITION.md
            docs/TERRAIN_AND_STRUCTURES.md
            src/core/controller/ControllerApi.ts
            docs/ORIGIN_TRAIT_CATALOGUE.md
            docs/ORIGIN_VALIDATION_COVERAGE.md
            docs/official-ai/README.md
            docs/official-ai/OFFICIAL_AI_ARCHITECTURE.md
            docs/official-ai/OFFICIAL_AI_ORIGIN_SUPPORT.md
            docs/official-ai/OFFICIAL_AI_TRAIT_SUPPORT.md
            docs/official-ai/OFFICIAL_AI_ORIGIN_CONFIGURATIONS.md
            design/official-ai/origin-trait-support.config.ts
            design/official-ai/origin-configurations.config.ts
            docs/official-ai/OFFICIAL_AI_CHARACTER_CONFIGURATIONS.md
            docs/official-ai/OFFICIAL_AI_PRESETS.md
            design/official-ai/character-configurations.config.ts
          )
          for path in "${owners[@]}"; do
            git show "${TARGET_MAIN_SHA}:${path}" >/dev/null
          done

      - name: Reconstruct exact no-churn issue-51 tree
        shell: bash
        run: |
          set -euo pipefail
          cat AGENTS.md >/dev/null

          python3 <<'PY'
          from pathlib import Path
          import json

          def section(text, start, end):
              i = text.index(start)
              j = text.index(end, i)
              return text[i:j]

          design = Path("docs/OPEN_FUFU_DESIGN.md").read_text()
          catalogue = Path("docs/ORIGIN_TRAIT_CATALOGUE.md").read_text()
          coverage = Path("docs/ORIGIN_VALIDATION_COVERAGE.md").read_text()
          terrain = Path("docs/TERRAIN_AND_STRUCTURES.md").read_text()
          trait_ai = Path("docs/official-ai/OFFICIAL_AI_TRAIT_SUPPORT.md").read_text()

          snapshots = {
              "visibility": section(design, "### 5.1.1 Tactical visibility projection\n", "## 5.2 Starter controller"),
              "invariant15": next(line for line in design.splitlines() if line.startswith("15. Tactical operational visibility")),
              "p45_table": next(line for line in catalogue.splitlines() if line.startswith("| P45 |")),
              "p49_table": next(line for line in catalogue.splitlines() if line.startswith("| P49 |")),
              "p45_section": section(catalogue, "### P45 — Forest concealment\n", "### P46 — Tundra construction"),
              "p49_section": section(catalogue, "### P49 — Counterintelligence Observation Posts\n", "### P50 and P51 — reciprocal support fields"),
              "p45_validation": next(line for line in coverage.splitlines() if line.startswith("- **P45 — Hidden Leaf Village**")),
              "p49_validation": next(line for line in coverage.splitlines() if line.startswith("- **P49 — Laughing Man**")),
              "observation_validation": section(coverage, "## Observation / concealment\n", "\n---\n"),
              "observation_post": section(terrain, "### Observation Post\n", "### Command Post"),
              "trait_p45": section(trait_ai, "## P45 — Hidden Leaf Village\n", "## P46 —"),
          }
          Path("/tmp/issue51-final-snapshots.json").write_text(json.dumps(snapshots))
          PY

          git checkout "${TARGET_MAIN_SHA}" -- \
            design/official-ai/origin-configurations.config.ts \
            docs/NAVAL_AND_STRATEGIC_WEAPONS.md \
            docs/OPEN_FUFU_DESIGN.md \
            docs/ORIGIN_TRAIT_CATALOGUE.md \
            docs/ORIGIN_VALIDATION_COVERAGE.md \
            docs/RULE_COMPOSITION.md \
            docs/TERRAIN_AND_STRUCTURES.md \
            docs/official-ai/OFFICIAL_AI_ORIGIN_CONFIGURATIONS.md \
            docs/official-ai/OFFICIAL_AI_TRAIT_SUPPORT.md \
            src/core/controller/ControllerApi.ts \
            src/core/rules/OriginRuleManifest.ts \
            src/core/rules/RuleComposition.ts \
            tests/ControllerApiContract.test.ts \
            tests/ControllerStructureFieldProjection.test.ts \
            tests/OriginManifestConformance.test.ts \
            tests/StructureFieldGeometry.test.ts

          python3 <<'PY'
          from pathlib import Path
          import json

          data = json.loads(Path("/tmp/issue51-final-snapshots.json").read_text())

          def read(path): return Path(path).read_text()
          def write(path, text): Path(path).write_text(text)
          def replace_once(text, old, new):
              count = text.count(old)
              assert count == 1, (old[:100], count)
              return text.replace(old, new, 1)
          def replace_section(text, start, end, replacement):
              i = text.index(start)
              j = text.index(end, i)
              return text[:i] + replacement + text[j:]
          def replace_prefixed_line(text, prefix, replacement):
              lines = text.splitlines()
              matches = [i for i, line in enumerate(lines) if line.startswith(prefix)]
              assert len(matches) == 1, (prefix, matches)
              lines[matches[0]] = replacement
              return "\n".join(lines) + ("\n" if text.endswith("\n") else "")

          path = "docs/OPEN_FUFU_DESIGN.md"
          text = read(path)
          assert "### 5.1.1 Tactical visibility projection" not in text
          text = replace_once(text, "## 5.2 Starter controller", data["visibility"] + "## 5.2 Starter controller")
          assert data["invariant15"] not in text
          text = text.rstrip("\n") + "\n" + data["invariant15"] + "\n"
          write(path, text)

          path = "docs/ORIGIN_TRAIT_CATALOGUE.md"
          text = read(path)
          text = replace_prefixed_line(text, "| P45 |", data["p45_table"])
          text = replace_prefixed_line(text, "| P49 |", data["p49_table"])
          text = replace_section(text, "### P45 — Forest concealment\n", "### P46 — Tundra construction", data["p45_section"])
          text = replace_section(text, "### P49 — Counterintelligence Observation Posts\n", "### P50 and P51 — reciprocal support fields", data["p49_section"])
          write(path, text)

          path = "docs/ORIGIN_VALIDATION_COVERAGE.md"
          text = read(path)
          text = replace_prefixed_line(text, "- **P45 — Hidden Leaf Village**", data["p45_validation"])
          text = replace_prefixed_line(text, "- **P49 — Laughing Man**", data["p49_validation"])
          text = replace_section(text, "## Observation / concealment\n", "\n---\n", data["observation_validation"])
          write(path, text)

          path = "docs/TERRAIN_AND_STRUCTURES.md"
          text = read(path)
          text = replace_section(text, "### Observation Post\n", "### Command Post", data["observation_post"])
          write(path, text)

          path = "design/official-ai/origin-configurations.config.ts"
          text = read(path)
          assert text.count('"FOREST_INTERIOR_CONCEALMENT"') == 2
          text = text.replace('"FOREST_INTERIOR_CONCEALMENT"', '"OWNED_FOREST_CONCEALMENT"')
          write(path, text)

          path = "docs/official-ai/OFFICIAL_AI_ORIGIN_CONFIGURATIONS.md"
          text = read(path)
          assert text.count("owned Forest interiors") == 2
          text = text.replace("owned Forest interiors", "owned Forest cells")
          write(path, text)

          path = "docs/official-ai/OFFICIAL_AI_TRAIT_SUPPORT.md"
          text = read(path)
          text = replace_section(text, "## P45 — Hidden Leaf Village\n", "## P46 —", data["trait_p45"])
          write(path, text)

          path = "src/core/controller/ControllerApi.ts"
          text = read(path)
          text = replace_once(text,
              "// This file deliberately does not expose inherited mutable Game/Player/Unit/\n// Execution internals. Runtime adapters must project legal immutable observations\n// into these types and validate returned decisions transactionally.\n",
              "// This file deliberately does not expose inherited mutable Game/Player/Unit/\n// Execution internals. Runtime adapters must project legal immutable observations\n// into these types and validate returned decisions transactionally. Current-state\n// entity, derived, mechanics, event, and quote surfaces must all obey the same\n// requester-relative tactical-visibility projection from OPEN_FUFU_DESIGN.md.\n")
          text = replace_once(text,
              '} from "../rules/RuleComposition";\n\nexport type Tick = number;',
              '} from "../rules/RuleComposition";\n\n/** Structure fields queryable by controllers; OBSERVATION is not a rule-condition field ID. */\nexport type ControllerStructureFieldId = StructureFieldId | "OBSERVATION";\n\nexport type Tick = number;')
          text = replace_once(text,
              "       * Authoritative union of active effective structure fields. Runtime owns\n       * field geometry; controllers must not approximate this with CIRCLE.\n       */\n      readonly kind: \"STRUCTURE_FIELD\";\n      readonly field: StructureFieldId;",
              "       * Authoritative union of active effective structure fields. Runtime owns\n       * field geometry; controllers must not approximate this with CIRCLE.\n       * OBSERVATION selects active Observation-Post reveal/blackout geometry.\n       */\n      readonly kind: \"STRUCTURE_FIELD\";\n      readonly field: ControllerStructureFieldId;")
          text = replace_once(text,
              "  operational(): readonly OperationalContactView[];",
              "  /** Current operational contacts are already requester-lawful visibility projections. */\n  operational(): readonly OperationalContactView[];")
          text = replace_once(text,
              "export interface OperationsApi {\n  get(id: OperationId): OperationView | undefined;\n  own(): readonly OperationView[];\n  incoming(): readonly OperationView[];\n}",
              "export interface OperationsApi {\n  /** Hidden/unknown operations are indistinguishable and return undefined. */\n  get(id: OperationId): OperationView | undefined;\n  own(): readonly OperationView[];\n  /** Contains only incoming operations lawfully visible to this requester. */\n  incoming(): readonly OperationView[];\n}")
          text = replace_once(text,
              "export interface StructuresApi {\n  get(id: StructureId): StructureView | undefined;\n  list(ownerId?: FactionId): readonly StructureView[];\n}",
              "export interface StructuresApi {\n  /** Hidden/unknown structures are indistinguishable and return undefined. */\n  get(id: StructureId): StructureView | undefined;\n  /** Contains only structures lawfully visible to this requester. */\n  list(ownerId?: FactionId): readonly StructureView[];\n}")
          text = replace_once(text,
              "export interface UnitsApi {\n  get(id: UnitId): UnitView | undefined;\n  list(ownerId?: FactionId): readonly UnitView[];\n}",
              "export interface UnitsApi {\n  /** Hidden/unknown units are indistinguishable and return undefined. */\n  get(id: UnitId): UnitView | undefined;\n  /** Contains only units lawfully visible to this requester. */\n  list(ownerId?: FactionId): readonly UnitView[];\n}")
          text = replace_once(text,
              " * When legal=false, ffySpent and populationSpent are always zero; ffyRequired may\n * remain non-zero to expose the effective affordability requirement independently.\n */",
              " * When legal=false, ffySpent and populationSpent are always zero; ffyRequired may\n * remain non-zero to expose the effective affordability requirement independently.\n * Entity-addressed quotes must not distinguish a concealed known ID from an unknown\n * or otherwise unavailable ID, and blind cell-targeted quotes must not leak concealed\n * contents through failureCode/detail/cost differences.\n */")
          text = replace_once(text,
              "  readonly observationRadius?: number;\n  readonly observationEffect?: ObservationStructureEffect;",
              "  /** Ergonomic only; use STRUCTURE_FIELD/OBSERVATION for authoritative cells. */\n  readonly observationRadius?: number;\n  readonly observationEffect?: ObservationStructureEffect;")
          text = replace_once(text,
              "  /**\n   * Effective currently active mechanics for a physical structure, including its\n   * authoritative current-owner acquisition provenance. Fresh inactive construction\n   * has no completed mechanics yet and returns undefined; an upgrade returns the\n   * previous completed level's active mechanics until completion.\n   */\n  structureSpec(structureId: StructureId): StructureMechanicsSpec | undefined;",
              "  /**\n   * Effective currently active mechanics for a lawfully visible physical structure,\n   * including its authoritative current-owner acquisition provenance. A hidden or\n   * unknown ID and fresh inactive construction all return undefined; an upgrade\n   * returns the previous completed level's active mechanics until completion.\n   */\n  structureSpec(structureId: StructureId): StructureMechanicsSpec | undefined;")
          text = replace_once(text,
              "  unitSpec(unitId: UnitId): UnitMechanicsSpec;",
              "  /** Hidden and unknown unit IDs are indistinguishable and return undefined. */\n  unitSpec(unitId: UnitId): UnitMechanicsSpec | undefined;")
          text = replace_once(text,
              "export interface EventsApi {\n  readonly sinceLastDecision: readonly ControllerEvent[];\n}",
              "export interface EventsApi {\n  /** Events are requester-lawful projections and never act as a hidden-state side channel. */\n  readonly sinceLastDecision: readonly ControllerEvent[];\n}")
          write(path, text)

          path = "tests/ControllerStructureFieldProjection.test.ts"
          text = read(path)
          old = 'expect(source).toContain("readonly field: StructureFieldId;");'
          assert text.count(old) == 2
          text = text.replace(old, 'expect(source).toContain("readonly field: ControllerStructureFieldId;");', 1)
          write(path, text)
          PY

          rm "${WORKFLOW_PATH}"

          cat > /tmp/expected-files <<'EOF'
          design/official-ai/origin-configurations.config.ts
          docs/OPEN_FUFU_DESIGN.md
          docs/ORIGIN_TRAIT_CATALOGUE.md
          docs/ORIGIN_VALIDATION_COVERAGE.md
          docs/TERRAIN_AND_STRUCTURES.md
          docs/official-ai/OFFICIAL_AI_ORIGIN_CONFIGURATIONS.md
          docs/official-ai/OFFICIAL_AI_TRAIT_SUPPORT.md
          src/core/controller/ControllerApi.ts
          src/core/visibility/TacticalVisibility.ts
          tests/ControllerStructureFieldProjection.test.ts
          tests/ObservationFieldVocabulary.test.ts
          tests/TacticalVisibility.test.ts
          EOF
          sed -i 's/^          //' /tmp/expected-files
          git diff --name-only "${TARGET_MAIN_SHA}" -- | sort > /tmp/actual-files
          diff -u /tmp/expected-files /tmp/actual-files

          for path in \
            docs/NAVAL_AND_STRATEGIC_WEAPONS.md \
            docs/RULE_COMPOSITION.md \
            src/core/rules/OriginRuleManifest.ts \
            src/core/rules/RuleComposition.ts \
            tests/ControllerApiContract.test.ts \
            tests/OriginManifestConformance.test.ts \
            tests/StructureFieldGeometry.test.ts; do
            git diff --exit-code "${TARGET_MAIN_SHA}" -- "${path}"
          done
          git diff --check

      - name: Verify issue-51 semantic preservation and stale terminology
        shell: bash
        run: |
          set -euo pipefail
          cat AGENTS.md >/dev/null
          python3 <<'PY'
          from pathlib import Path
          design = Path("docs/OPEN_FUFU_DESIGN.md").read_text()
          assert "### 5.1.1 Tactical visibility projection" in design
          assert "15.0 seconds" in design
          assert "independent third-party witness" in design
          assert "One-shot Population losses, grants, and transfers" in design
          assert "V1 has no neutral or third diplomatic relation" in design
          catalogue = Path("docs/ORIGIN_TRAIT_CATALOGUE.md").read_text()
          assert "P45OwnedForest(holder, cell)" in catalogue
          assert "no** interior/front-boundary distinction" in catalogue
          assert "ENEMY_BLACKOUT" in catalogue
          assert "same authoritative effective `OBSERVATION` structure field" in catalogue
          terrain = Path("docs/TERRAIN_AND_STRUCTURES.md").read_text()
          assert "canonical `OBSERVATION` structure field" in terrain
          assert "ordinary effect is `REVEAL`" in terrain
          assert "SELF_OR_FIXED_TEAMMATE" in terrain
          assert "SAM Launcher" in terrain
          controller = Path("src/core/controller/ControllerApi.ts").read_text()
          assert 'export type ControllerStructureFieldId = StructureFieldId | "OBSERVATION";' in controller
          assert 'readonly kind: "STRUCTURE_FIELD_INSTANCE";' in controller
          assert 'readonly eligibilityField: Extract<StructureFieldId, "SAM_LAUNCHER">;' in controller
          assert 'unitSpec(unitId: UnitId): UnitMechanicsSpec | undefined;' in controller
          visibility = Path("src/core/visibility/TacticalVisibility.ts").read_text()
          assert "observingFactionIds" in visibility
          assert "affectedFactionIds" not in visibility
          origin_config = Path("design/official-ai/origin-configurations.config.ts").read_text()
          assert origin_config.count('"OWNED_FOREST_CONCEALMENT"') == 2
          assert '"FOREST_INTERIOR_CONCEALMENT"' not in origin_config
          PY

          if grep -R -n --exclude-dir=.git --exclude-dir=node_modules -E 'FOREST_INTERIOR_CONCEALMENT|owned Forest interiors|exposed Forest-front boundary|affectedFactionIds|whose owned state is actually targeted or affected receives|reveals only the minimum information|minimum directly relevant attacking state' .; then
            echo "stale issue-51 terminology remains" >&2
            exit 1
          fi
          test ! -e "${WORKFLOW_PATH}"
          git diff --check

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          cat AGENTS.md >/dev/null
          npm ci

      - name: Run full repository tests on exact candidate tree
        shell: bash
        run: |
          set -euo pipefail
          cat AGENTS.md >/dev/null
          npm test

      - name: Run strict documentation authority on exact candidate tree
        shell: bash
        run: |
          set -euo pipefail
          cat AGENTS.md >/dev/null
          npx tsx scripts/checkDocumentationAuthority.ts --strict

      - name: Final ownership/base guard, exact-tree commit, and push
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cat AGENTS.md >/dev/null
          comments="$(gh api "repos/${GITHUB_REPOSITORY}/issues/51/comments" --paginate --jq '.[].body')"
          grep -F "${CLAIM_ID}" <<<"${comments}" >/dev/null
          grep -F 'Branch registration: `issue-51/of-issue51-20260907-cccaaa-observation-contract`' <<<"${comments}" >/dev/null
          test "$(gh api "repos/${GITHUB_REPOSITORY}/pulls/74" --jq '.head.ref')" = "${TOPIC_BRANCH}"
          gh api "repos/${GITHUB_REPOSITORY}/pulls/74" --jq '.body' | grep -F "${CLAIM_ID}" >/dev/null
          test "$(gh api "repos/${GITHUB_REPOSITORY}/branches/main" --jq '.commit.sha')" = "${TARGET_MAIN_SHA}"
          test ! -e "${WORKFLOW_PATH}"

          git add -A
          git diff --cached --check
          git diff --cached --name-only "${TARGET_MAIN_SHA}" -- | sort > /tmp/staged-files
          diff -u /tmp/expected-files /tmp/staged-files
          for path in \
            docs/NAVAL_AND_STRATEGIC_WEAPONS.md \
            docs/RULE_COMPOSITION.md \
            src/core/rules/OriginRuleManifest.ts \
            src/core/rules/RuleComposition.ts \
            tests/ControllerApiContract.test.ts \
            tests/OriginManifestConformance.test.ts \
            tests/StructureFieldGeometry.test.ts; do
            git diff --cached --exit-code "${TARGET_MAIN_SHA}" -- "${path}"
          done

          git config user.name "R-Andrei"
          git config user.email "30163089+R-Andrei@users.noreply.github.com"
          git -c core.hooksPath=/dev/null commit \
            -m "${CLAIM_ID}: freeze no-churn audit candidate" \
            -m "${CLAIM_ID}

          Conclusion: reconstruct the exact current-main-plus-issue51 tree with only the 12 classified visibility/Origin/API/AI/test files changed; repository tests, stale-term checks, strict authority validation, and byte-equality guards pass. Commit hooks are bypassed only here so lint-staged cannot reformat the already-validated merge tree and reintroduce unrelated churn.
          Recommendation: perform the final read-only canonical-owner and Mechanics/Origin/Character-AI audit against this frozen SHA, recheck current main and CI, record the audit in PR #74, and do not merge until explicitly requested."

          git diff --exit-code
          git diff --name-only "${TARGET_MAIN_SHA}" HEAD -- | sort > /tmp/committed-files
          diff -u /tmp/expected-files /tmp/committed-files
          git diff --check "${TARGET_MAIN_SHA}" HEAD
          git push origin "HEAD:${TOPIC_BRANCH}"
