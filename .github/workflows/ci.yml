name: 🛡️ Open Fufu Owned Validation

on:
  merge_group:
    types:
      - checks_requested
  pull_request:
  push:
    branches:
      - main
      - issue-134-official-ai-docker-context-OF-ISSUE134-20260909-BLD8F2

permissions:
  contents: read

jobs:
  baseline:
    name: Owned validation boundary
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: false
      - name: Setup node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Enforce Open Fufu validation ownership
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            npx tsx scripts/checkValidationBoundary.ts --base "origin/${{ github.base_ref }}"
          elif [[ "${{ github.event_name }}" == "merge_group" ]]; then
            npx tsx scripts/checkValidationBoundary.ts --base "${{ github.event.merge_group.base_sha }}"
          else
            npx tsx scripts/checkValidationBoundary.ts --base "${{ github.event.before }}"
          fi
      - name: Test Open Fufu-owned surface
        run: npm test
      - name: Validate production isolated-vm native runtime
        shell: bash
        run: |
          image="open-fufu-controller-runtime:${GITHUB_SHA}"
          docker build --target prod-deps -t "$image" .
          docker run --rm --entrypoint node "$image" \
            --no-node-snapshot \
            -e "import('isolated-vm').then(() => console.log('isolated-vm native runtime ok')).catch((error) => { console.error(error); process.exit(1); })"
      - name: Probe #134 production Docker build
        if: github.event_name == 'push' && github.ref == 'refs/heads/issue-134-official-ai-docker-context-OF-ISSUE134-20260909-BLD8F2'
        shell: bash
        run: docker build --target build -t "open-fufu-issue134-build:${GITHUB_SHA}" .
