name: 🧪 Open Fufu Baseline

on:
  merge_group:
    types:
      - checks_requested
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  baseline:
    name: ✅ Build, test, and lint
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          submodules: false
      - name: Setup node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build and typecheck
        run: npm run build-prod
      - name: Test active suite
        run: npm test
      - name: Lint
        run: npm run lint:github
