name: 🛡️ Open Fufu Owned Validation

on:
  merge_group:
    types:
      - checks_requested
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  baseline:
    name: Owned validation boundary
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: false
      - name: Setup node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Enforce Open Fufu validation ownership
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            npx tsx scripts/checkValidationBoundary.ts --base "origin/${{ github.base_ref }}"
          elif [[ "${{ github.event_name }}" == "merge_group" ]]; then
            npx tsx scripts/checkValidationBoundary.ts --base "${{ github.event.merge_group.base_sha }}"
          else
            npx tsx scripts/checkValidationBoundary.ts --base "${{ github.event.before }}"
          fi
      - name: Test Open Fufu-owned surface
        run: npm test
