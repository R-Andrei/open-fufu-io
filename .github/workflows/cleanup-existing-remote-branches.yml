name: One-time stale remote branch cleanup

on:
  push:
    branches:
      - chore/remote-branch-hygiene

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete verified stale remote branches and remove this workflow
        uses: actions/github-script@v8
        with:
          script: |
            const staleBranches = [
              'docs/ai-difficulty-targets',
              'docs/cleanup-stale-design-todos',
              'docs/close-spawn-naval-weapons-minor-factions',
              'docs/close-trade-capture-counter-origins',
              'docs/controller-runtime-sqlite-canon',
              'docs/echo-content-finalization',
              'docs/echo-generated-names',
              'docs/echo-identity-reward-migration',
              'docs/echo-score-fix-staging',
              'docs/echo-v1-finalization',
              'docs/ffy-economy-settled-baseline',
              'docs/ffy-trade-and-origin-economies',
              'docs/finalize-origin-names',
              'docs/finalize-train-system',
              'docs/n14-echo-naming-content',
              'docs/origin-ai-v1-roster',
              'docs/refine-star-and-port-repair',
              'docs/reward-difficulty-sync',
              'docs/scale-growth-rail-constraints',
              'feat/controller-typescript-contract',
              'tmp/prettier-baseline-check',
            ];

            for (const branch of staleBranches) {
              try {
                await github.rest.git.deleteRef({
                  ...context.repo,
                  ref: `heads/${branch}`,
                });
                core.info(`Deleted ${branch}`);
              } catch (error) {
                if (error.status === 404 || error.status === 422) {
                  core.info(`Already absent: ${branch}`);
                  continue;
                }
                throw error;
              }
            }

            const branch = 'chore/remote-branch-hygiene';
            const path = '.github/workflows/cleanup-existing-remote-branches.yml';
            const file = await github.rest.repos.getContent({
              ...context.repo,
              path,
              ref: branch,
            });

            await github.rest.repos.deleteFile({
              ...context.repo,
              path,
              message: 'chore: remove one-time stale branch cleanup',
              sha: file.data.sha,
              branch,
            });
